name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so `knowledge:check` can resolve `git merge-base origin/main HEAD`
      # — a shallow (depth-1) checkout has no base history to diff the change against.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: pnpm run test:coverage

      # After the suite on purpose: `--from` buckets the JSON report the coverage
      # step just wrote instead of running the whole suite a second time, so the
      # count contract is gated for free. An absent or unreadable report is an
      # explicit skip, and a skip fails `--check`.
      - run: pnpm run counts:check --from vitest-report.json

      # The contract suite reads `src/templates/**` only, so a template edit that
      # was never deployed passes every test while the SKILL.md an agent loads
      # still teaches the superseded rule. This runs the real sync and fails if it
      # changes anything — the generated tree must be committed and current, the
      # same property `counts:check` enforces for the declared numbers.
      - run: pnpm run agents:check

      # Prevention for the ledger's most-repeated lesson: a change that edits a
      # module's src/** must bump that module's last_verified (via `prospec knowledge
      # verify`). Diffs merge-base(origin/main, HEAD)..HEAD — needs fetch-depth: 0 above.
      - run: pnpm run knowledge:check

      - name: Record the pull request number
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage/coverage-summary.json
            pr-number.txt
          if-no-files-found: ignore

  # The Windows binary release.yml ships had never had a single test run on Windows.
  # Deliberately a separate job rather than an `os` matrix on `test`: that job uploads the
  # coverage artifact ci-comment.yml reads, so a matrix would entangle wiring this job has
  # no need for.
  windows-smoke:
    runs-on: windows-latest
    # Observation window only — the suite has never run on Windows, so the first runs are
    # expected to surface failures unrelated to the shim. Removed, and the job listed as a
    # required check, once those are enumerated and each has a conclusion.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Narrow on purpose: the files that carry the shim classification and the record
      # path, plus the source-digest suites whose path and line-ending handling must hold
      # on Windows. `describe.runIf(process.platform === 'win32')` runs here for the
      # first time — the injected tests prove the decision, these prove the reality.
      # The test-queue files join them: the queue's mutex, liveness and tree-kill rules
      # were measured on POSIX only, so this job is where their Windows behaviour is seen.
      - run: pnpm exec vitest run tests/unit/lib/test-runner.test.ts tests/unit/services/check.service.test.ts tests/unit/lib/source-digest.test.ts tests/unit/lib/module-digests.test.ts tests/unit/lib/test-queue-engine.test.ts tests/unit/lib/test-queue.test.ts tests/unit/lib/process-tree.test.ts

      # The claim skip-unspawnable-test-command shipped without ever executing: on a host
      # where the resolved test command is a `.cmd` shim, test-provenance must be an
      # honest skip, never a FAIL no configuration could clear.
      #
      # Must not inherit the implicit `success()`: the step above is EXPECTED to go red
      # during the observation window, and the job-level continue-on-error above governs
      # the workflow conclusion, not step sequencing — without this guard the one piece of
      # evidence this job exists to produce is skipped exactly when it matters. GitHub's
      # own docs prefer `!cancelled()` over `always()` (which would also run after a
      # cancelled checkout).
      - if: ${{ !cancelled() }}
        run: pnpm exec tsx scripts/windows-smoke-record-tests.ts
