name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run typecheck

      - run: pnpm run build

      - run: pnpm run test:coverage

      # After the suite on purpose: `--from` buckets the JSON report the coverage
      # step just wrote instead of running the whole suite a second time, so the
      # count contract is gated for free. Without `--from` the script still spawns
      # its own run (the local `pnpm counts` path) — an absent or unreadable
      # report is an explicit skip, and a skip fails `--check`.
      - run: pnpm run counts:check --from vitest-report.json

      # The contract suite reads `src/templates/**` only, so a template edit that
      # was never deployed passes every test while the SKILL.md an agent loads
      # still teaches the superseded rule. This runs the real sync and fails if it
      # changes anything — the generated tree must be committed and current, the
      # same property `counts:check` enforces for the declared numbers.
      - run: pnpm run agents:check

      - name: Compose coverage comment
        if: always()
        # body is built only from .total numeric fields + fixed metric names —
        # no file paths or user strings, so it carries no markdown-injection vector
        shell: bash
        run: |
          {
            echo '## Test Coverage'
            echo
            if [ -f coverage/coverage-summary.json ]; then
              echo '| Metric | Coverage | Covered / Total |'
              echo '| --- | --- | --- |'
              jq -r '
                .total
                | to_entries[]
                | select(.key=="statements" or .key=="branches" or .key=="functions" or .key=="lines")
                | "| \(.key) | \(.value.pct)% | \(.value.covered) / \(.value.total) |"
              ' coverage/coverage-summary.json
            else
              echo '_coverage summary not found (the test step may have failed before producing coverage)._'
            fi
          } > coverage-comment.md

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage-comment.md
            coverage/coverage-summary.json
          if-no-files-found: ignore

  # The Windows binary release.yml ships had never had a single test run on Windows.
  # Deliberately a separate job rather than an `os` matrix on `test`: that job's coverage
  # step is bound to `shell: bash` + `jq` and feeds `comment` through a named artifact,
  # so a matrix would entangle wiring this job has no need for.
  windows-smoke:
    runs-on: windows-latest
    # Observation window only — the suite has never run on Windows, so the first runs are
    # expected to surface failures unrelated to the shim. Removed, and the job listed as a
    # required check, once those are enumerated and each has a conclusion.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

      # Narrow on purpose: the two files that carry the shim classification and the
      # record path. `describe.runIf(process.platform === 'win32')` runs here for the
      # first time — the injected tests prove the decision, these prove the reality.
      - run: pnpm exec vitest run tests/unit/lib/test-runner.test.ts tests/unit/services/check.service.test.ts

      # The claim skip-unspawnable-test-command shipped without ever executing: on a host
      # where the resolved test command is a `.cmd` shim, test-provenance must be an
      # honest skip, never a FAIL no configuration could clear.
      #
      # Must not inherit the implicit `success()`: the step above is EXPECTED to go red
      # during the observation window, and the job-level continue-on-error above governs
      # the workflow conclusion, not step sequencing — without this guard the one piece of
      # evidence this job exists to produce is skipped exactly when it matters. GitHub's
      # own docs prefer `!cancelled()` over `always()` (which would also run after a
      # cancelled checkout).
      - if: ${{ !cancelled() }}
        run: pnpm exec tsx scripts/windows-smoke-record-tests.ts

  comment:
    if: always() && github.event_name == 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download coverage report
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
      - name: Ensure comment body exists
        shell: bash
        run: |
          if [ ! -f coverage-comment.md ]; then
            printf '## Test Coverage\n\n_coverage report unavailable (the test job may have failed before producing coverage)._\n' > coverage-comment.md
          fi
      - name: Post sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: coverage
          path: coverage-comment.md
