# Prospec deterministic drift gate — zero LLM, zero tokens.
# Permissions are read-only: a pull request from a fork only ever gets a read-only token,
# so this workflow posts no comment — prospec-check-comment.yml does, from the report
# artifact this run uploads.
name: Prospec Check

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history — knowledge-health reports each module's commit times, which a
          # shallow clone leaves null; freshness itself is judged by source content digest.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # this repo IS the prospec package — build it before self-checking (dogfood)
      - run: pnpm run build
      - name: Run prospec check (strict gate)
        # explicit bash turns on pipefail — without it, tee's exit 0 would mask the gate
        shell: bash
        run: node dist/cli/index.js check --strict --json | tee prospec-check-output.txt
      - name: Record the pull request number
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > pr-number.txt
      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prospec-report
          path: |
            prospec-report.json
            prospec-check-output.txt
            pr-number.txt
          if-no-files-found: ignore
