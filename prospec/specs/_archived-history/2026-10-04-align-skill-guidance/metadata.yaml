      scenarios:
        - id: US-1.1
          story_id: US-1
          text: WHEN 我依 knowledge 指引量測知識大小，THEN 指引使用有效的 `prospec check` 形式並指出應查看的
            `knowledge-size` 結果。
          source: proposal.md:19
        - id: US-1.2
          story_id: US-1
          text: WHEN 我將 review 輪數上限設為 1，THEN 指引與 CLI 接受的設定一致，不把可用範圍描述為 3–5。
          source: proposal.md:20
        - id: US-1.3
          story_id: US-1
          text: WHEN 我閱讀同一規則的 shipped、init 與專案文件，THEN 它們提供與現有程式判準一致的操作指引。
          source: proposal.md:21
        - id: US-2.1
          story_id: US-2
          text: "WHEN 變更為 `scale: backfill` 且 `backfill-draft.md` 存在，THEN 指引依 backfill
            驗證規則說明 task 與 test 維度的處理。"
          source: proposal.md:34
        - id: US-2.2
          story_id: US-2
          text: "WHEN 變更只有 `scale: backfill` 而沒有 draft，THEN 指引不授予 proven-backfill 豁免。"
          source: proposal.md:35
        - id: US-2.3
          story_id: US-2
          text: WHEN 非 proven backfill 的 review 判定為 FAIL、skipped 或 unprovable，THEN 指引要求依
            CLI 拒收原因完成補救後再記錄 verify 結果。
          source: proposal.md:36
        - id: US-2.4
          story_id: US-2
          text: WHEN promote 已追溯受影響模組，THEN 指引要求記錄它們，並依 CLI 回報完成同步，不宣稱空的 `related_modules`
            必然讓同步閘門通過。
          source: proposal.md:37
        - id: US-3.1
          story_id: US-3
          text: WHEN 本輪沒有新 findings 但累積表仍有列，THEN 指引不宣稱 CLI 必然產生 clean
            sentence；每輪計數與關閉輪次的義務仍成立。
          source: proposal.md:50
        - id: US-3.2
          story_id: US-3
          text: WHEN 合併後累積表為 0 列，THEN CLI 產生 artifact language 的 clean
            sentence，指引不要求開發者手動附加。
          source: proposal.md:51
        - id: US-3.3
          story_id: US-3
          text: WHEN review 的豁免 WARN 已寫入 metadata 後重新評估失敗，THEN CLI help 與雙語 Reference 說明
            WARN 留存且合併未完成的結果。
          source: proposal.md:52
        - id: US-4.1
          story_id: US-4
          text: WHEN 模組需要 sub-module 或 supplementary docs，THEN 指引允許建立並從 README
            連結這些文件，不宣稱模組目錄只能有 README。
          source: proposal.md:65
        - id: US-4.2
          story_id: US-4
          text: WHEN supplementary doc 是流程圖，THEN 知識範圍指引與 diagram conventions 一致，並保留逐檔知識量測。
          source: proposal.md:66
        - id: US-4.3
          story_id: US-4
          text: WHEN 下游專案取得重新生成的 skills 與 init 文件，THEN 它們使用通用的知識入口規則，不要求沿用本 repo 早期的檔名格式。
          source: proposal.md:67
