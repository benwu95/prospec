# Module dependency map — source of truth for module boundaries + dependency direction.
# Authored to match prospec/index.md (curated 6-module structure).
# Dependency direction (Constitution): cli → services → lib → types (no upward imports).
modules:
  - name: types
    description: Zod schemas, error hierarchy, skill definitions and host invocation
      profiles, Constitution rule types, the station I/O contracts the cli-first
      skills speak (review findings, verify dimension registry, lesson upsert,
      validate kinds), and the canonical index-table column and
      knowledge-token-budget contracts, plus numeric token/cost interfaces.
      Terminal history contracts separate source origin, canonical storage and
      partial outcomes.
    paths:
      - src/types
